name: Office department sync checks

on:
  push:
    branches:
      - office/department-sync-review
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Office department synchronization
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check bot JavaScript syntax
        run: node --check index.js

      - name: Run Office department sync tests
        run: node --test tests/office-department-sync.test.cjs
