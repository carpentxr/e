name: Office department sync syntax check

on:
  push:
    branches:
      - office/department-sync-review
  pull_request:
    branches:
      - main

jobs:
  syntax:
    name: Check bot JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check index.js syntax
        run: node --check index.js
